DEFAULT live
PROMPT 0
TIMEOUT 50
ONTIMEOUT live

LABEL live
  MENU LABEL Retro OS 0.1 (Live)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components username=retro init=/lib/systemd/systemd systemd.unit=graphical.target quiet splash loglevel=3 systemd.show_status=false rd.udev.log_level=3 vt.global_cursor_default=0
