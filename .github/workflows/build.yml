name: Build Retro OS Linux ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Debian Live build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring squashfs-tools xorriso syslinux-common syslinux-utils isolinux cpio grub-efi-amd64-bin
          echo "Checking live-build kernel helper..."
          sudo grep -n 'Contents-' /usr/lib/live/build/lb_chroot_linux-image
          sudo python3 - <<'PY'
          from pathlib import Path
          p = Path("/usr/lib/live/build/lb_chroot_linux-image")
          s = p.read_text()
          old = '/dists/${LB_PARENT_DISTRIBUTION}/Contents-'
          new = '/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-'
          old2 = '/dists/${LB_DISTRIBUTION}/Contents-'
          new2 = '/dists/${LB_DISTRIBUTION}/main/Contents-'
          if old not in s and old2 not in s:
              raise SystemExit("Expected Contents URL patterns were not found; refusing to continue")
          s = s.replace(old, new).replace(old2, new2)
          p.write_text(s)
          PY
          echo "Patched Contents index path:"
          sudo grep -n 'Contents-' /usr/lib/live/build/lb_chroot_linux-image
          sudo grep -q '/main/Contents-' /usr/lib/live/build/lb_chroot_linux-image
          sudo python3 - <<'PY'
          from pathlib import Path
          p = Path("/usr/lib/live/build/lb_binary_syslinux")
          lines = p.read_text().splitlines()
          out = []
          count = 0
          for line in lines:
              if "mv binary/live/" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  diagnostic = [
                      "echo '=== DIAGNOSTIC: before live kernel/initrd move ==='",
                      "pwd",
                      "ls -lah chroot/boot binary binary/live 2>&1 || true",
                      "find chroot/boot -maxdepth 1 -type f \\( -name 'vmlinuz*' -o -name 'initrd*' \\) -print 2>/dev/null || true",
                      "find binary -maxdepth 3 -type f -print 2>/dev/null || true",
                  ]
                  out.extend(indent + item for item in diagnostic)
                  count += 1
              out.append(line)
          if count == 0:
              raise SystemExit("No binary/live move commands found in lb_binary_syslinux")
          p.write_text("\n".join(out) + "\n")
          print(f"Inserted diagnostics before {count} move command(s)")
          PY
          sudo grep -n -B 5 'mv binary/live/' /usr/lib/live/build/lb_binary_syslinux
          sudo python3 - <<'PY'
          from pathlib import Path
          p = Path("/usr/lib/live/build/lb_binary_syslinux")
          lines = p.read_text().splitlines()
          out = []
          patched = {"vmlinuz": 0, "initrd.img": 0}
          for line in lines:
              stripped = line.strip()
              if stripped == "mv binary/live/vmlinuz-* binary/live/vmlinuz":
                  indent = line[:len(line) - len(line.lstrip())]
                  out.extend([
                      indent + "latest=$(find binary/live -maxdepth 1 -type f -name 'vmlinuz-*' -printf '%f\\n' | sort -V | tail -n 1)",
                      indent + "test -n \"$latest\"",
                      indent + "find binary/live -maxdepth 1 -type f -name 'vmlinuz-*' ! -name \"$latest\" -delete",
                      indent + "mv \"binary/live/$latest\" binary/live/vmlinuz",
                  ])
                  patched["vmlinuz"] += 1
              elif stripped == "mv binary/live/initrd.img-* binary/live/initrd.img":
                  indent = line[:len(line) - len(line.lstrip())]
                  out.extend([
                      indent + "latest=$(find binary/live -maxdepth 1 -type f -name 'initrd.img-*' -printf '%f\\n' | sort -V | tail -n 1)",
                      indent + "test -n \"$latest\"",
                      indent + "find binary/live -maxdepth 1 -type f -name 'initrd.img-*' ! -name \"$latest\" -delete",
                      indent + "mv \"binary/live/$latest\" binary/live/initrd.img",
                  ])
                  patched["initrd.img"] += 1
              else:
                  out.append(line)
          if patched != {"vmlinuz": 1, "initrd.img": 1}:
              raise SystemExit(f"Expected one kernel and one initrd move; found {patched}")
          p.write_text("\n".join(out) + "\n")
          print(f"Patched version selection: {patched}")
          PY
          sudo grep -n -A 4 'latest=$(find binary/live' /usr/lib/live/build/lb_binary_syslinux
          echo "Patched Contents index path:"
          sudo grep -n 'Contents-' /usr/lib/live/build/lb_chroot_linux-image

      - name: Configure Debian Live image
        run: |
          set -eu
          mkdir -p config/includes.chroot/etc/apt/sources.list.d
          mkdir -p config/includes.binary/live
          touch config/includes.binary/live/.keep
          mkdir -p config/package-lists
          printf '%s\\n' 'isolinux' 'librsvg2-bin' 'syslinux-utils' 'grub-efi-amd64-bin' 'retroarch' > config/package-lists/retro-os-bootloader.list.chroot
          printf '%s\\n' 'deb https://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware' > config/includes.chroot/etc/apt/sources.list.d/retro-os-security.list
          lb config --ignore-system-defaults --mode debian --distribution bookworm --architectures amd64 --linux-packages linux-image --initramfs live-boot --security false --binary-images iso-hybrid --debian-installer false --archive-areas "main contrib non-free non-free-firmware" --keyring-packages debian-archive-keyring --mirror-bootstrap http://deb.debian.org/debian --mirror-chroot http://deb.debian.org/debian --mirror-chroot-security http://security.debian.org/debian-security --mirror-binary http://deb.debian.org/debian --mirror-binary-security http://security.debian.org/debian-security --bootappend-live "boot=live components quiet splash"

      - name: Prepare complete ISOLINUX bootloader theme
        run: |
          set -eu
          SOURCE=/usr/share/live/build/bootloaders/isolinux
          if [ ! -d "$SOURCE" ]; then
            SOURCE=/usr/share/live/build/bootloaders
          fi
          test -d "$SOURCE"
          mkdir -p config/bootloaders/isolinux
          cp -a "$SOURCE/." config/bootloaders/isolinux/
          if [ -f /usr/lib/ISOLINUX/isolinux.bin ]; then
            install -m 0644 /usr/lib/ISOLINUX/isolinux.bin config/bootloaders/isolinux/isolinux.bin
          elif [ -f /usr/lib/isolinux/isolinux.bin ]; then
            install -m 0644 /usr/lib/isolinux/isolinux.bin config/bootloaders/isolinux/isolinux.bin
          else
            echo "::error::isolinux.bin not found"
            find /usr/lib -type f -name isolinux.bin -print
            exit 1
          fi
          BIOS_MODULES=/usr/lib/syslinux/modules/bios
          for MODULE in ldlinux.c32 libcom32.c32 libutil.c32 vesamenu.c32; do
            if [ ! -s "$BIOS_MODULES/$MODULE" ]; then
              echo "::error::$MODULE not found in $BIOS_MODULES"
              find /usr/lib -type f -name "$MODULE" -print
              exit 1
            fi
            install -m 0644 "$BIOS_MODULES/$MODULE" "config/bootloaders/isolinux/$MODULE"
          done
          printf '' | cpio -o -H newc > config/bootloaders/isolinux/bootlogo

      - name: Diagnose and build image
        run: |
          set -eux
          echo "=== live-build version ==="
          lb --version
          echo "=== relevant live-build kernel move commands ==="
          sudo grep -R -n -C 5 'binary/live/vmlinuz' /usr/lib/live/build 2>/dev/null || true
          echo "=== kernel files before build ==="
          sudo find chroot/boot -maxdepth 1 -name 'vmlinuz*' -print 2>/dev/null || true
          sudo find chroot/boot -maxdepth 1 -name 'initrd*' -print 2>/dev/null || true
          echo "=== binary/live files before build ==="
          sudo find binary/live -maxdepth 2 -type f -print 2>/dev/null || true
          echo "=== binary directories before build ==="
          sudo find binary -maxdepth 3 -type d -print 2>/dev/null || true
          echo "=== run live-build ==="
          sudo lb build

      - name: Locate and stage ISO image
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for generated ISO files..."
          if [ -f "./binary.hybrid.iso" ]; then
            ISO_FILE="./binary.hybrid.iso"
          else
            ISO_FILE="$(find . -maxdepth 5 -type f -iname '*.iso' -not -path './.git/*' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$ISO_FILE" ] || [ ! -f "$ISO_FILE" ]; then
            echo "::error::No ISO file was generated"
            ls -lah
            exit 1
          fi
          cp "$ISO_FILE" retro-os-live-amd64.iso
          ISO_LIST="$(xorriso -indev retro-os-live-amd64.iso -find / -type f -exec lsdl 2>&1)"
          printf '%s\\n' "$ISO_LIST"
          for REQUIRED in isolinux.bin vmlinuz initrd.img; do
            if ! printf '%s\\n' "$ISO_LIST" | grep -Fqi "$REQUIRED"; then
              echo "::error::$REQUIRED is missing from the generated ISO"
              exit 1
            fi
          done
          ls -lh retro-os-live-amd64.iso

      - name: Publish ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-live-amd64
          path: retro-os-live-amd64.iso
          if-no-files-found: error
