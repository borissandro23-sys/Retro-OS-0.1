name: Build Retro OS Linux ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Debian Live build tools and Debian archive keys
        run: |
          sudo apt-get update
          sudo apt-get install -y sudo live-build debootstrap debian-archive-keyring squashfs-tools xorriso syslinux-common syslinux-utils isolinux cpio

      - name: Configure Debian Live image
        run: |
          mkdir -p config/includes.chroot/etc/apt/sources.list.d
          mkdir -p config/includes.binary/live
          touch config/includes.binary/live/.keep
          mkdir -p config/package-lists
          printf '%s\n' 'isolinux' 'librsvg2-bin' 'syslinux-utils' 'grub-efi-amd64-bin' > config/package-lists/retro-os-bootloader.list.chroot
          printf '%s\n' 'deb https://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware' > config/includes.chroot/etc/apt/sources.list.d/retro-os-security.list
          lb config \
            --ignore-system-defaults \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --linux-packages linux-image \
            --initramfs live-boot \
            --security false \
            --binary-images iso-hybrid \
            --bootloaders "syslinux grub-efi" \
            --uefi-secure-boot disable \
            --debian-installer false \
            --archive-areas "main contrib non-free non-free-firmware" \
            --keyring-packages debian-archive-keyring \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-chroot-security http://security.debian.org/debian-security \
            --mirror-binary http://deb.debian.org/debian \
            --mirror-binary-security http://security.debian.org/debian-security \
            --bootappend-live "boot=live components quiet splash"

      - name: Prepare complete ISOLINUX bootloader theme
        run: |
          SOURCE=/usr/share/live/build/bootloaders/isolinux
          test -d "$SOURCE"
          mkdir -p config/bootloaders/isolinux
          cp -a "$SOURCE/." config/bootloaders/isolinux/
          install -m 0644 /usr/lib/ISOLINUX/isolinux.bin config/bootloaders/isolinux/isolinux.bin
          install -m 0644 /usr/lib/syslinux/modules/bios/vesamenu.c32 config/bootloaders/isolinux/vesamenu.c32
          LDLINUX="$(find /usr/lib -type f -name ldlinux.c32 -print -quit)"
          if [ -z "$LDLINUX" ]; then
            echo "::error::ldlinux.c32 not found in installed Syslinux packages"
            find /usr/lib -type f \( -name '*ldlinux*' -o -name 'vesamenu.c32' -o -name 'isolinux.bin' \) -print
            exit 1
          fi
          install -m 0644 "$LDLINUX" config/bootloaders/isolinux/ldlinux.c32
          echo "Using ldlinux.c32 from $LDLINUX"
          printf '' | cpio -o -H newc > config/bootloaders/isolinux/bootlogo
          test -s config/bootloaders/isolinux/isolinux.bin
          test -s config/bootloaders/isolinux/vesamenu.c32
          test -s config/bootloaders/isolinux/ldlinux.c32
          test -s config/bootloaders/isolinux/bootlogo

      - name: Build image
        run: sudo lb build

      - name: Locate and stage ISO image
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for generated ISO files..."
          # live-build creates this image at the repository root.
          if [ -f "./binary.hybrid.iso" ]; then
            ISO_FILE="./binary.hybrid.iso"
          else
            # Ignore permission-denied diagnostics from chroot/cache directories.
            ISO_FILE="$(find . -maxdepth 5 -type f -iname '*.iso' -not -path './.git/*' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$ISO_FILE" ] || [ ! -f "$ISO_FILE" ]; then
            echo "::error::No ISO file was generated"
            echo "Top-level files:"
            ls -lah
            exit 1
          fi
          echo "Found ISO: $ISO_FILE"
          cp "$ISO_FILE" retro-os-live-amd64.iso
          echo "Checking bootloader files inside ISO..."
          ISO_LIST="$(xorriso -indev retro-os-live-amd64.iso -find / -type f -exec lsdl 2>&1)"
          printf '%s\n' "$ISO_LIST"
          for REQUIRED in ldlinux.c32 isolinux.bin vesamenu.c32 BOOTX64.EFI; do
            if ! printf '%s\n' "$ISO_LIST" | grep -Fqi "$REQUIRED"; then
              echo "::error::$REQUIRED is missing from the generated ISO"
              exit 1
            fi
          done
          ls -lh retro-os-live-amd64.iso

      - name: Publish ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-live-amd64
          path: retro-os-live-amd64.iso
          if-no-files-found: error
